<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 180px; height: 180px; background: #f7f4ef; }
  body { display: grid; place-items: center; }
  .icon {
    width: 180px;
    height: 180px;
    border-radius: 40px;
    background: #15120d;
    display: grid;
    place-items: center;
  }
  svg { width: 108px; height: 108px; }
</style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M16 48 48 16" stroke="#ca9f75" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="7 6.5" fill="none"/>
      <circle cx="48" cy="16" r="3.6" fill="#ca9f75"/>
      <circle cx="16" cy="48" r="2.4" fill="#f7f4ef"/>
    </svg>
  </div>
</body>
</html>

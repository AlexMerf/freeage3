<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>hero-designer</title>
<link rel="stylesheet" href="mock.css">
<style>
  html, body { width: 859px; height: 549px; }
  .laptop__screen { background: #f7f4ef; }

  .ds-hero { display: grid; grid-template-columns: 346px minmax(0, 1fr); flex: 1; min-height: 0; }

  .ds-copy {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 26px 26px 26px 34px;
  }

  .ds-copy h1 {
    margin-top: 13px;
    font-size: 35px;
    font-weight: 600;
    line-height: 1.02;
    letter-spacing: -0.035em;
    text-transform: uppercase;
  }

  .ds-lead {
    max-width: 26ch;
    margin-top: 13px;
    font-size: 10px;
    line-height: 1.55;
    color: var(--muted);
  }

  .ds-copy .btn { margin-top: 16px; align-self: flex-start; }

  .ds-visual { position: relative; overflow: hidden; }

  .ds-visual::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(90% 70% at 84% 12%, rgba(255, 255, 255, 0.4), transparent 60%),
      linear-gradient(180deg, transparent 58%, rgba(30, 24, 15, 0.24));
  }

  .ds-ghost {
    position: absolute;
    right: -12px;
    bottom: -54px;
    font-size: 260px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.06em;
    color: rgba(247, 244, 239, 0.14);
  }

  .ds-sprig {
    position: absolute;
    left: 42%;
    top: 16%;
    width: 150px;
    height: 200px;
    color: rgba(247, 244, 239, 0.9);
    transform: rotate(6deg);
    opacity: 0.9;
  }

  .ds-cap {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(247, 244, 239, 0.9);
  }

  .ds-strip {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px;
    flex: none;
    height: 82px;
    border-top: 1px solid var(--line);
    background: var(--line);
  }

  .ds-strip__item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 12px;
    background: var(--paper);
  }

  .ds-strip__thumb { width: 40px; height: 52px; flex: none; }

  .ds-strip__name { font-size: 8.5px; line-height: 1.3; }
  .ds-strip__price { margin-top: 4px; font-size: 8px; color: var(--accent); }
</style>
</head>
<body>
  <div class="laptop">
    <div class="laptop__body">
      <div class="laptop__camera"></div>
      <div class="laptop__screen">
        <div class="site">
          <div class="site__bar">
            <span class="wordmark">ATELIER</span>
            <nav class="site__nav"><span>Коллекции</span><span>Лукбук</span><span>О бренде</span></nav>
            <div class="site__icons"><i class="icon"></i><i class="icon icon--bag"></i></div>
          </div>

          <div class="ds-hero">
            <div class="ds-copy">
              <p class="eyebrow">SS22 · новая коллекция</p>
              <h1>Одежда, в которой видно руку</h1>
              <p class="ds-lead">Лён, хлопок и ручная вышивка. Спокойные силуэты, небольшие партии.</p>
              <span class="btn btn--dark">Смотреть коллекцию</span>
            </div>
            <div class="ds-visual linen tone-indigo">
              <span class="ds-ghost">A</span>
              <span class="sprig ds-sprig"></span>
              <div class="ds-cap"><span>Look 01 — льняное платье</span><span>01 / 24</span></div>
            </div>
          </div>

          <div class="ds-strip">
            <div class="ds-strip__item">
              <div class="thumb ds-strip__thumb linen tone-sage"><span class="sprig"></span></div>
              <div><p class="ds-strip__name">Платье льняное</p><p class="ds-strip__price">18 900 ₽</p></div>
            </div>
            <div class="ds-strip__item">
              <div class="thumb ds-strip__thumb linen tone-sand"><span class="sprig"></span></div>
              <div><p class="ds-strip__name">Блуза с вышивкой</p><p class="ds-strip__price">12 400 ₽</p></div>
            </div>
            <div class="ds-strip__item">
              <div class="thumb ds-strip__thumb linen tone-clay"><span class="sprig"></span></div>
              <div><p class="ds-strip__name">Юбка льняная</p><p class="ds-strip__price">9 800 ₽</p></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="laptop__base"></div>
  </div>
</body>
</html>

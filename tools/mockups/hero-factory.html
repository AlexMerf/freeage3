<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>hero-factory</title>
<link rel="stylesheet" href="mock.css">
<style>
  html, body { width: 273px; height: 505px; }

  .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 24px;
    padding: 4px 14px 0;
    font-size: 7px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .status__icons { display: flex; gap: 4px; align-items: center; }
  .status__icons i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); opacity: 0.7; }
  .status__icons i:nth-child(2) { width: 8px; border-radius: 2px; }
  .status__icons i:nth-child(3) { width: 10px; border-radius: 2px; }

  .shop-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 36px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
  }

  .shop-bar .wordmark { font-size: 7.5px; letter-spacing: 0.26em; }

  .burger { display: flex; flex-direction: column; gap: 3px; }
  .burger i { width: 12px; height: 1px; background: var(--ink-soft); }

  .hero {
    position: relative;
    overflow: hidden;
    height: 212px;
    padding: 14px 12px 13px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    color: #fbf8f1;
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(28, 22, 14, 0.12) 0%, rgba(24, 19, 12, 0.58) 100%);
  }

  .hero > * { position: relative; }

  .hero__eyebrow {
    font-size: 6.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(251, 248, 241, 0.8);
  }

  .hero h1 {
    margin-top: 6px;
    font-size: 21px;
    font-weight: 600;
    line-height: 0.98;
    letter-spacing: -0.03em;
    text-transform: uppercase;
  }

  .hero__sub {
    margin-top: 5px;
    font-size: 7px;
    line-height: 1.45;
    color: rgba(251, 248, 241, 0.82);
  }

  .hero .btn {
    align-self: flex-start;
    margin-top: 10px;
    padding: 6px 9px;
    border-color: rgba(251, 248, 241, 0.7);
    color: #fbf8f1;
    font-size: 6px;
  }

  .hero__sprig {
    position: absolute;
    right: 12px;
    top: 12px;
    width: 46px;
    height: 64px;
    color: rgba(251, 248, 241, 0.55);
  }

  .section {
    padding: 12px 12px 0;
  }

  .section__head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .section__title { font-size: 8px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
  .section__link { font-size: 6.5px; color: var(--muted); }

  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .cat__img { height: 78px; }

  .cat__name { margin-top: 5px; font-size: 7.5px; line-height: 1.3; }
  .cat__count { margin-top: 2px; font-size: 6px; color: var(--muted); }

  .tabbar {
    display: flex;
    align-items: center;
    justify-content: space-around;
    height: 30px;
    border-top: 1px solid var(--line);
    margin-top: 8px;
  }

  .tabbar i {
    width: 9px;
    height: 9px;
    border: 1px solid var(--ink-soft);
    border-radius: 50%;
    opacity: 0.55;
  }

  .tabbar i:nth-child(2) { border-radius: 1px; }
  .tabbar i:nth-child(3) { border-radius: 1px 1px 4px 4px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="phone__body">
      <div class="phone__screen">
        <div class="status">
          <span>16:25</span>
          <span class="status__icons"><i></i><i></i><i></i></span>
        </div>

        <div class="shop-bar">
          <span class="wordmark">MANUFAKTURA</span>
          <span class="burger"><i></i><i></i></span>
        </div>

        <div class="hero linen tone-linen">
          <span class="sprig hero__sprig"></span>
          <p class="hero__eyebrow">Новая коллекция</p>
          <h1>Льняной текстиль</h1>
          <p class="hero__sub">Для дома и сервировки. Ткани с вышивкой ручной работы.</p>
          <span class="btn">Смотреть каталог</span>
        </div>

        <div class="section">
          <div class="section__head">
            <span class="section__title">Категории</span>
            <span class="section__link">Все →</span>
          </div>
          <div class="cats">
            <div>
              <div class="thumb cat__img linen tone-sand"><span class="sprig"></span></div>
              <p class="cat__name">Столовый текстиль</p>
              <p class="cat__count">24 предмета</p>
            </div>
            <div>
              <div class="thumb cat__img linen tone-sage"><span class="sprig"></span></div>
              <p class="cat__name">Полотенца</p>
              <p class="cat__count">18 предметов</p>
            </div>
          </div>
        </div>

        <div class="tabbar"><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <div class="phone__notch"></div>
  </div>
</body>
</html>

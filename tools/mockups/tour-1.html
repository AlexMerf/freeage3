<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>tour-1</title>
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="tour.css">
<style>
  .hero { display: grid; grid-template-columns: 290px minmax(0, 1fr); height: 278px; border-bottom: 1px solid var(--line); }
  .hero__copy { display: flex; flex-direction: column; justify-content: center; padding: 24px; }
  .hero__copy h2 { margin-top: 10px; font-size: 30px; font-weight: 600; line-height: 0.96; letter-spacing: -0.04em; text-transform: uppercase; }
  .hero__copy p { max-width: 24ch; margin-top: 10px; font-size: 6.5px; line-height: 1.5; color: var(--muted); }
  .hero__copy .btn { align-self: flex-start; margin-top: 12px; padding: 6px 9px; font-size: 6px; }
  .hero__visual { position: relative; overflow: hidden; }
  .hero__visual .sprig { position: absolute; left: 48%; top: 48%; width: 92px; height: 124px; transform: translate(-50%, -50%); color: rgba(247, 244, 239, 0.85); }
  .hero__ghost { position: absolute; right: -10px; bottom: -34px; font-size: 150px; font-weight: 600; line-height: 1; color: rgba(247, 244, 239, 0.14); letter-spacing: -0.06em; }

  .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; height: 118px; background: var(--line); }
  .strip__item { display: flex; gap: 10px; padding: 12px 14px; background: var(--paper); }
  .strip__thumb { width: 46px; height: 66px; flex: none; }
  .strip__name { font-size: 6.5px; line-height: 1.3; }
  .strip__price { margin-top: 4px; font-size: 6px; color: var(--accent); }
</style>
</head>
<body>
  <div class="page">
    <header class="top">
      <span class="wordmark">ATELIER</span>
      <nav class="top__nav"><span class="is-active">Коллекции</span><span>Лукбук</span><span>О бренде</span></nav>
      <div class="top__icons"><i class="icon"></i><i class="icon icon--bag"></i></div>
    </header>

    <div class="main">
      <div class="hero">
        <div class="hero__copy">
          <p class="eyebrow" style="font-size:7px">SS22 · новая коллекция</p>
          <h2>Одежда, в которой видно руку</h2>
          <p>Лён, хлопок и ручная вышивка. Спокойные силуэты, небольшие партии.</p>
          <span class="btn btn--dark">Смотреть коллекцию</span>
        </div>
        <div class="hero__visual linen tone-indigo">
          <span class="hero__ghost">A</span>
          <span class="sprig"></span>
        </div>
      </div>

      <div class="strip">
        <div class="strip__item">
          <div class="thumb strip__thumb linen tone-sage"><span class="sprig"></span></div>
          <div><p class="strip__name">Платье льняное</p><p class="strip__price">18 900 ₽</p></div>
        </div>
        <div class="strip__item">
          <div class="thumb strip__thumb linen tone-sand"><span class="sprig"></span></div>
          <div><p class="strip__name">Блуза с вышивкой</p><p class="strip__price">12 400 ₽</p></div>
        </div>
        <div class="strip__item">
          <div class="thumb strip__thumb linen tone-clay"><span class="sprig"></span></div>
          <div><p class="strip__name">Юбка льняная</p><p class="strip__price">9 800 ₽</p></div>
        </div>
      </div>
    </div>

    <footer class="foot"><span>ATELIER · SS22</span><span>Главная</span></footer>
  </div>
</body>
</html>

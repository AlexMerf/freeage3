<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Montserrat";
    src: url("../assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("../assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
      U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122;
  }

  * { margin: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    font-family: "Montserrat", sans-serif;
    background:
      radial-gradient(900px 520px at 84% -10%, rgba(202, 159, 117, 0.28), transparent 62%),
      radial-gradient(700px 460px at 8% 108%, rgba(4, 41, 193, 0.22), transparent 60%),
      #14110d;
    color: #f4efe6;
    padding: 62px 68px;
    display: flex;
    flex-direction: column;
  }

  .top {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 17px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #b3a998;
  }

  .dot { color: #ca9f75; }

  h1 {
    margin-top: 46px;
    font-size: 84px;
    font-weight: 600;
    line-height: 0.98;
    letter-spacing: -0.03em;
    text-transform: uppercase;
  }

  h1 .sub {
    display: block;
    margin-top: 20px;
    font-size: 34px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.01em;
    text-transform: none;
    color: #cfc6b6;
  }

  .bottom {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: auto;
    font-size: 19px;
    color: #b3a998;
  }

  .brand {
    color: #f4efe6;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .rule {
    flex: 1;
    height: 1px;
    background: rgba(202, 159, 117, 0.45);
  }

  .sites {
    font-size: 15px;
    letter-spacing: 0.04em;
    color: #9c9384;
  }
</style>
</head>
<body>
  <div class="top">
    <span>Кейс</span><span class="dot">·</span><span>1С-Битрикс</span><span class="dot">·</span><span>2022</span>
  </div>

  <h1>
    Два магазина<br>вместо одного
    <span class="sub">разделение сайта текстильной фабрики на фабрику и бренд её дизайнера</span>
  </h1>

  <div class="bottom">
    <span class="brand">freeage<span class="dot">.</span></span>
    <span class="rule"></span>
    <span class="sites">клиент не раскрывается · имена и домены изменены</span>
  </div>
</body>
</html>
